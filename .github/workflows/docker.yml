name: Release 3X-UI for Docker

permissions:
  contents: read
  packages: write

# Called by the release workflow for every versioned release; run it by hand to
# rebuild the image of a tag that already exists.
on:
  workflow_call:
    inputs:
      version:
        required: true
        type: string
      latest:
        required: true
        type: boolean
  workflow_dispatch:
    inputs:
      version:
        description: "Existing release tag to build, e.g. v3.9.0-mahsa-r1"
        required: true
        type: string
      latest:
        description: "Also tag the image as latest"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.version }}
          submodules: true

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ghcr.io/gfw-knocker/3x-ui
          # Same names a tag push used to produce: v3.9.0-mahsa-r1, 3.9.0-mahsa-r1, latest.
          flavor: |
            latest=false
          tags: |
            type=raw,value=${{ inputs.version }}
            type=semver,pattern={{version}},value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          provenance: mode=max
          sbom: true
          platforms: linux/amd64,linux/arm64/v8,linux/arm/v7,linux/arm/v6,linux/386
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
